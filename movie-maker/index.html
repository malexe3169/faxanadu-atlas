<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Movie Maker</title>
<script src="https://cdn.jsdelivr.net/npm/jsnes@2.1.0/dist/jsnes.min.js" integrity="sha384-9VM07v3soyIdTnWETAJmGKMQ0OnmtTnnv5rF5APysr6eFopiJc4KoFYMvt9QFPvk" crossorigin="anonymous"></script>
<style>
:root { --bg:#0f1419; --panel:#161c23; --ink:#e6edf3; --muted:#9aa7b4; --line:#2a333d; --chip:#1f2730; --accent:#58a6c8; --ok:#3fb27f; --warn:#d4a72c; --bad:#f47067;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* the menu, the drawer and the sheet set display themselves, so hidden must win */
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--sans); }
.wrap { max-width: 820px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 10px; }
.bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.bar .sp { flex:1; }
button, select, input[type=text], input[type=number] { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px 12px; }
button { cursor:pointer; } button:disabled { opacity:.4; cursor:default; }
button.go { background:var(--accent); border-color:var(--accent); color:#06141b; font-weight:600; }
button.chip { padding:4px 10px; font-size:13px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.stagebox { position:relative; background:#000; border-radius:10px; overflow:hidden; }
canvas#screen { display:block; width:100%; image-rendering: pixelated; aspect-ratio: 256/240; }
canvas.hand { cursor:grab; } canvas.grabbing { cursor:grabbing; } canvas.pen { cursor:crosshair; }
.tools { position:absolute; left:8px; top:8px; display:flex; flex-direction:column; gap:6px; }
.tools button { width:36px; height:36px; padding:0; font-size:18px; background:rgba(22,28,35,.9); }
.tools button.on { background:var(--accent); color:#06141b; }
.drawer { position:absolute; right:8px; top:8px; width:240px; background:rgba(22,28,35,.96); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:8px; font-size:14px; }
.drawer h3 { margin:0; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
.drawer .row { display:flex; gap:6px; align-items:center; }
.drawer .row label { color:var(--muted); width:64px; font-size:13px; }
.drawer input[type=range] { flex:1; }
.poses { display:flex; gap:4px; flex-wrap:wrap; }
.poses canvas, .tray canvas { image-rendering:pixelated; background:var(--chip); border:1px solid var(--line); border-radius:4px; cursor:pointer; padding:2px; }
.poses canvas.on, .tray canvas.on { border-color:var(--accent); }
details.more summary { cursor:pointer; color:var(--muted); font-size:13px; }
.form { display:grid; grid-template-columns:max-content 1fr; gap:4px 8px; font-size:13px; align-items:center; }
.form input, .form select { width:100%; padding:3px 6px; }
.form textarea { grid-column:1 / -1; width:100%; font:12px var(--mono); min-height:44px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
.scrub { display:flex; gap:8px; align-items:center; }
.scrub input[type=range] { flex:1; }
.tray { display:flex; gap:6px; flex-wrap:wrap; align-items:flex-end; padding:8px; background:var(--panel); border-radius:10px; min-height:52px; }
.tray .lbl { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; align-self:center; }
.line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--muted); }
.toast { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(22,28,35,.96); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; max-width:90%; }
.toast.bad { border-color:var(--bad); } .toast.ok { border-color:var(--ok); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
.sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; max-width:560px; width:100%; display:grid; gap:10px; max-height:90vh; overflow:auto; }
.sheet ol { margin:0; padding-left:20px; } .sheet li { margin:6px 0; }
.msgs { list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:14px; }
.msgs li { padding-left:14px; position:relative; } .msgs li::before { content:""; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:50%; background:var(--muted); }
.msgs li.ok::before { background:var(--ok); } .msgs li.warn::before { background:var(--warn); } .msgs li.bad::before { background:var(--bad); }
.menu { position:relative; } .menu > div { position:absolute; right:0; top:110%; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; display:grid; gap:4px; min-width:220px; z-index:5; }
.menu > div button { text-align:left; }
.small { font-size:13px; } .muted { color:var(--muted); }
h1#h1 { margin:4px 0 0; font-size:19px; }
#length-other:not(:empty) { cursor:pointer; text-decoration:underline dotted; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1"></h1>
  <div class="bar">
    <button id="rom" class="chip" type="button"></button>
    <input id="file" type="file" accept=".nes" hidden>
    <select id="movie"></select>
    <button id="from-rom" class="chip" type="button"></button>
    <button id="undo" class="chip" type="button">↶</button><button id="redo" class="chip" type="button">↷</button>
    <span class="sp"></span>
    <button id="play" class="go" type="button"></button>
    <div class="menu"><button id="export" type="button"></button><div id="export-menu" hidden></div></div>
    <button id="lang" class="chip" type="button"></button>
    <button id="help" class="chip" type="button">?</button>
  </div>
  <div class="stagebox" id="stagebox">
    <canvas id="screen" width="256" height="240"></canvas>
    <div class="tools" id="tools">
      <button id="t-move" type="button" title="move">✋</button>
      <button id="t-draw" type="button" title="draw a path">✎</button>
      <button id="t-stop" type="button" title="stop" hidden>◼</button>
      <button id="t-mute" type="button" title="sound" hidden>🔊</button>
    </div>
    <div class="drawer" id="drawer" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <p id="intro" class="small muted"></p>
  <div class="scrub"><button id="step-back" class="chip" type="button">◀</button><button id="step-fwd" class="chip" type="button">▶</button><input id="frame" type="range" min="0" max="600" value="0"><span id="frame-n" class="small muted">0 / 0</span><button id="loop" class="chip" type="button">▶ loop</button></div>
  <div class="line"><span id="l-length"></span><select id="length-kind"></select><input id="length-value" type="number" min="1" max="65535" style="width:90px"><span id="length-other" class="small"></span></div>
  <details class="more" id="movie-more"><summary id="l-movie-more"></summary><div id="movie-more-body"></div></details>
  <div class="tray" id="tray"></div>
  <details class="line" id="art"><summary id="l-art"></summary>
    <div class="bar"><button id="art-bg" class="chip" type="button"></button><button id="art-fig" class="chip" type="button"></button>
      <input id="art-bg-file" type="file" accept="image/*" hidden><input id="art-fig-file" type="file" accept="image/*" hidden>
      <span id="l-caption"></span><input id="caption" type="text" maxlength="32" placeholder="THE KING WAITS" style="width:200px"><span id="l-row"></span><input id="caption-row" type="number" min="0" max="29" value="26" style="width:64px"><button id="caption-go" class="chip" type="button"></button>
    </div>
    <div class="line"><label><input id="depth" type="checkbox" checked> <span id="l-depth"></span></label></div>
  </details>
  <p id="hint" class="small muted"></p>
</div>
<div class="overlay" id="sheet" hidden><div class="sheet" id="sheet-body"></div></div>

<script type="module">
import * as P from "./src/page.mjs?v=2.0.2";
import { createPlayer, KEYS } from "./src/play.mjs?v=2.0.2";
import { makeStore } from "./src/store.mjs?v=2.0.2";
import { TrackKind, ProjectRole, makePhase } from "./src/types.mjs?v=2.0.2";
import { defaultTrack, ensureUniqueId } from "./src/editor.mjs";
import { validate } from "./src/bundle.mjs";

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function sel(options, value, on) { const s = el("select"); for (const [k, v] of Object.entries(options)) { const o = el("option", null, v); o.value = k; if (+k === +value) o.selected = true; s.append(o); } s.addEventListener("change", () => on(+s.value)); return s; }
let lang = localStorage.getItem("atlas-movie-lang") === "fr" ? "fr" : "en";
const t = () => P.T[lang];

// ---- state ----------------------------------------------------------------------
let romInfo = null, project = P.newProject(), movieIndex = 0, actorIndex = -1, phaseIndex = 0, frame = 0, looping = null;
let tool = "move", stroke = null, drag = null, lastPic = null, pristine = true, piecesKey = null;
let moreOpen = false, movieMoreOpen = false;
const history = P.makeHistory(100);
let player = null, audio = null, muted = false, raf = null;
const movie = () => project.movies[movieIndex];

// ---- remembering ---------------------------------------------------------------------
function idbBackend() {
  const open = () => new Promise((res, rej) => { const r = indexedDB.open("atlas-movie-maker", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction("kv", mode); const rq = fn(tx.objectStore("kv")); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); }); };
  return { get: (k) => run("readonly", (s) => s.get(k)), set: (k, v) => run("readwrite", (s) => s.put(v, k)), del: (k) => run("readwrite", (s) => s.delete(k)) };
}
let store = null;
try { store = makeStore(idbBackend()); } catch { store = null; }
let saveTimer = null;
function autosave() { if (!store) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { let bytes; try { bytes = P.saveProject(project); } catch { return; } store.saveProject(bytes).catch(() => {}); }, 300); }
async function restore() {
  if (!store) return;
  try {
    const rom = await store.loadRom();
    if (rom) { romInfo = P.loadRom(rom.bytes); romInfo.name = rom.name; toast(t().romRemembered, "ok"); }
    const amp = await store.loadProject();
    if (amp) { project = P.openProject(amp); pristine = false; }
    else if (romInfo && romInfo.stock) { project = P.stockProject(romInfo); pristine = false; }
  } catch (e) { toast(e.message, "bad"); }
  render();
}

// ---- edits go through here: snapshot, do, save, redraw ------------------------------
function edit(fn) {
  const before = structuredClone(project);
  history.push(project); pristine = false;
  let ok = true;
  try { fn(); } catch (e) { ok = false; history.discard(); project = before; toast(e.message, "bad"); }
  autosave(); render();
  return ok;
}
$("undo").addEventListener("click", () => { const b = history.undo(project); if (b) { project = b; clampSelection(); autosave(); render(); } });
$("redo").addEventListener("click", () => { const f = history.redo(project); if (f) { project = f; clampSelection(); autosave(); render(); } });
function clampSelection() { movieIndex = Math.min(movieIndex, project.movies.length - 1); actorIndex = Math.min(actorIndex, movie().tracks.length - 1); phaseIndex = Math.min(phaseIndex, Math.max(0, movie().phases.length - 1)); }

// ---- the ROM -------------------------------------------------------------------------
async function takeRom(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  romInfo = P.loadRom(bytes); romInfo.name = file.name;
  if (!romInfo.shaped) toast(t().notrom, "bad");
  else if (!romInfo.usable) toast(t().unusable, "bad");
  else { if (store) store.saveRom(file.name, bytes).catch(() => {}); if (pristine && romInfo.stock) { project = P.stockProject(romInfo); pristine = false; history.clear(); autosave(); } }
  render();
}
$("rom").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => { if ($("file").files[0]) takeRom($("file").files[0]); });
for (const ev of ["dragenter", "dragover"]) document.addEventListener(ev, (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && /\.nes$/i.test(f.name)) takeRom(f); else if (f && /\.amp$/i.test(f.name)) openAmp(f); else if (f) toast(t().notrom, "bad"); });

// ---- the project ------------------------------------------------------------------
async function openAmp(f) { try { project = P.openProject(new Uint8Array(await f.arrayBuffer())); movieIndex = 0; actorIndex = -1; phaseIndex = 0; pristine = false; history.clear(); autosave(); render(); } catch (e) { toast(e.message, "bad"); } }
$("movie").addEventListener("change", () => {
  if (player) stopPlay();
  const v = $("movie").value;
  if (v === "+") { $("movie").value = String(movieIndex); showTemplates(); return; }
  movieIndex = +v; actorIndex = -1; phaseIndex = 0; frame = 0; render();
});
$("from-rom").addEventListener("click", () => { const ok = edit(() => { project = P.stockProject(romInfo); movieIndex = 0; actorIndex = -1; phaseIndex = 0; frame = 0; }); if (ok) toast(t().stockLoaded, "ok"); });
function showTemplates() {
  const body = $("sheet-body"); body.replaceChildren(el("h3", null, t().template));
  for (const tpl of P.templates()) { const b = el("button", null, tpl[lang]); b.disabled = !(romInfo && romInfo.stock); b.addEventListener("click", () => { $("sheet").hidden = true; edit(() => { movieIndex = P.addTemplate(romInfo, project, tpl.key); actorIndex = -1; frame = 0; }); }); body.append(b); }
  const blank = el("button", null, t().blank); blank.addEventListener("click", () => { $("sheet").hidden = true; edit(() => { const extra = P.newProject().movies.find((m) => m.project_role === ProjectRole.Normal); extra.id = "scene"; ensureUniqueId(project, extra); project.movies.push(extra); movieIndex = project.movies.length - 1; actorIndex = -1; validate(project); }); }); body.append(blank);
  const close = el("button", "chip", "×"); close.addEventListener("click", () => { $("sheet").hidden = true; }); body.append(close);
  $("sheet").hidden = false;
}

// ---- the picture -----------------------------------------------------------------------
function paint() {
  if (player) return;
  const ctx = $("screen").getContext("2d");
  $("frame-n").textContent = `${frame} / ${$("frame").max}`;
  if (!movie()) return;
  try {
    const pic = P.renderFrame(romInfo, movie(), frame); lastPic = pic;
    ctx.putImageData(new ImageData(pic.rgba, 256, 240), 0, 0);
    for (const a of pic.actors) { ctx.strokeStyle = a.index === actorIndex ? "#fff" : "rgba(255,255,255,.3)"; ctx.strokeRect(a.box.x - .5, a.box.y - .5, a.box.w + 1, a.box.h + 1); }
    if (actorIndex >= 0) {
      const ov = P.pathOverlay(movie(), actorIndex);
      if (ov.route.length > 1) { ctx.strokeStyle = "rgba(80,220,255,.9)"; ctx.beginPath(); ov.route.forEach(([x, y], i) => i ? ctx.lineTo(x + .5, y + .5) : ctx.moveTo(x + .5, y + .5)); ctx.stroke(); }
      ctx.fillStyle = "#ffd166"; for (const [x, y] of ov.waypoints) ctx.fillRect(x - 1, y - 1, 3, 3);
    }
    if (stroke) { ctx.strokeStyle = "#fff"; ctx.beginPath(); stroke.forEach(([x, y], i) => i ? ctx.lineTo(x + .5, y + .5) : ctx.moveTo(x + .5, y + .5)); ctx.stroke(); }
  } catch (e) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 256, 240); ctx.fillStyle = "#f47067"; ctx.font = "12px monospace"; ctx.fillText(e.message.slice(0, 40), 6, 16); }
}
function pixel(e) { const r = $("screen").getBoundingClientRect(); return [Math.max(0, Math.min(255, Math.floor((e.clientX - r.left) * 256 / r.width))), Math.max(0, Math.min(239, Math.floor((e.clientY - r.top) * 240 / r.height)))]; }
$("t-move").addEventListener("click", () => { tool = "move"; render(); });
$("t-draw").addEventListener("click", () => { tool = tool === "draw" ? "move" : "draw"; render(); });
$("screen").addEventListener("pointerdown", (e) => {
  if (player || !movie() || !lastPic) return;
  const [x, y] = pixel(e);
  $("screen").setPointerCapture(e.pointerId);
  const hit = P.hitActor(lastPic.actors, x, y);
  if ((tool === "draw" || e.shiftKey) && actorIndex >= 0) { stroke = [[x, y]]; paint(); return; }
  if (hit >= 0) { actorIndex = hit; drag = { x, y, moved: false, pushed: false }; $("screen").classList.add("grabbing"); render(); }
  else { actorIndex = -1; render(); }
});
$("screen").addEventListener("pointermove", (e) => {
  if (player || !movie()) return;
  const [x, y] = pixel(e);
  if (stroke) { const last = stroke[stroke.length - 1]; if (last[0] !== x || last[1] !== y) stroke.push([x, y]); paint(); return; }
  if (drag) { const dx = x - drag.x, dy = y - drag.y; if (dx || dy) { if (!drag.pushed) { history.push(project); drag.pushed = true; pristine = false; } P.dragActor(movie(), actorIndex, dx, dy); drag.x = x; drag.y = y; drag.moved = true; paint(); } return; }
  if (lastPic) $("screen").classList.toggle("hand", tool === "move" && P.hitActor(lastPic.actors, x, y) >= 0);
});
function pointerEnd() {
  $("screen").classList.remove("grabbing");
  if (drag) { const moved = drag.moved; drag = null; if (moved) { autosave(); render(); } }
  if (stroke) {
    const points = stroke; stroke = null; tool = "move";
    edit(() => { const ladder = $("depth").checked && romInfo && romInfo.stock ? P.stockLadder(romInfo.rom) : null; P.paintPath(project, movieIndex, actorIndex, points, undefined, undefined, ladder); frame = 0; });
  }
}
$("screen").addEventListener("pointerup", pointerEnd); $("screen").addEventListener("pointercancel", pointerEnd);

// ---- keys --------------------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  if (player) { if (e.code === "Escape") stopPlay(); else if (KEYS[e.code] !== undefined) { player.press(KEYS[e.code]); e.preventDefault(); } return; }
  if (["INPUT", "SELECT", "TEXTAREA"].includes((document.activeElement || {}).tagName)) return;
  if (e.code === "Escape") { actorIndex = -1; tool = "move"; render(); }
  else if ((e.code === "Delete" || e.code === "Backspace") && actorIndex >= 0) edit(() => { P.removeActor(project, movieIndex, actorIndex); actorIndex = -1; });
  else if ((e.ctrlKey || e.metaKey) && e.code === "KeyD" && actorIndex >= 0) { e.preventDefault(); edit(() => { actorIndex = P.duplicateActor(project, movieIndex, actorIndex); }); }
  else if ((e.ctrlKey || e.metaKey) && e.code === "KeyZ") { e.preventDefault(); (e.shiftKey ? $("redo") : $("undo")).click(); }
});
document.addEventListener("keyup", (e) => { if (player && KEYS[e.code] !== undefined) player.release(KEYS[e.code]); });

// ---- scrubbing --------------------------------------------------------------------------
$("frame").addEventListener("input", () => { frame = +$("frame").value; paint(); });
$("step-back").addEventListener("click", () => { frame = Math.max(0, frame - 1); $("frame").value = frame; paint(); });
$("step-fwd").addEventListener("click", () => { frame = Math.min(+$("frame").max, frame + 1); $("frame").value = frame; paint(); });
$("loop").addEventListener("click", () => { if (looping) { clearInterval(looping); looping = null; } else looping = setInterval(() => { frame = (frame + 1) % (+$("frame").max + 1); $("frame").value = frame; paint(); }, 1000 / 60); render(); });
$("length-kind").addEventListener("change", () => edit(() => P.setSceneLength(movie(), $("length-kind").value, +$("length-value").value)));
$("length-value").addEventListener("change", () => edit(() => P.setSceneLength(movie(), $("length-kind").value, +$("length-value").value)));
$("length-other").addEventListener("click", () => { $("movie-more").open = true; });
$("movie-more").addEventListener("toggle", () => { movieMoreOpen = $("movie-more").open; });

// ---- the drawer -------------------------------------------------------------------------
function thumb(piece, on, onClick) { const c = el("canvas", on ? "on" : ""); c.width = piece.w; c.height = piece.h; c.style.width = `${piece.w * 2}px`; c.style.height = `${piece.h * 2}px`; c.title = `${piece.index}: ${piece.w}x${piece.h}`; c.getContext("2d").putImageData(new ImageData(piece.rgba, piece.w, piece.h), 0, 0); c.addEventListener("click", onClick); return c; }
let pieceList = [];
function renderDrawer() {
  const d = $("drawer");
  if (player) { d.hidden = true; return; }
  const m = movie(); const tr = m && m.tracks[actorIndex];
  if (!tr) { d.hidden = true; return; }
  d.hidden = false; d.replaceChildren();
  const h = el("h3"); const name = el("input"); name.type = "text"; name.value = tr.editor_name; name.addEventListener("change", () => edit(() => { tr.editor_name = name.value; })); h.append(name);
  const x = el("button", "chip", "×"); x.addEventListener("click", () => { actorIndex = -1; render(); }); h.append(x); d.append(h);
  const poses = el("div", "poses");
  const current = tr.kind === TrackKind.Path ? tr.stage_frames[0] || [] : tr.kind === TrackKind.Cyclic ? tr.visible_frames : tr.toggle_frames;
  for (const p of pieceList) poses.append(thumb(p, current.includes(p.index), () => edit(() => P.setPose(m, actorIndex, p.index))));
  d.append(el("div", "small muted", t().pose), poses);
  if (tr.kind !== TrackKind.CounterToggle) {
    const row = el("div", "row"); row.append(el("label", null, t().speed));
    const s = el("input"); s.type = "range"; s.min = 0.25; s.max = 8; s.step = 0.125; s.value = P.speedOf(tr).toFixed(2); s.addEventListener("change", () => edit(() => P.setSpeed(tr, +s.value))); row.append(s); d.append(row);
    if (romInfo && romInfo.stock && tr.kind === TrackKind.Path) { const w = el("button", "chip", t().walkCycle); w.addEventListener("click", () => edit(() => { const ladder = P.stockLadder(romInfo.rom); tr.stage_frames = tr.stage_frames.map(() => ladder.away[0].frames.slice()); tr.dwell_frames = 8; })); d.append(w); }
  }
  const acts = el("div", "row"); const dup = el("button", "chip", t().duplicate); dup.addEventListener("click", () => edit(() => { actorIndex = P.duplicateActor(project, movieIndex, actorIndex); })); const del = el("button", "chip", t().deleteActor); del.addEventListener("click", () => edit(() => { P.removeActor(project, movieIndex, actorIndex); actorIndex = -1; })); acts.append(dup, del); d.append(acts);
  const more = el("details", "more"); more.open = moreOpen; more.addEventListener("toggle", () => { moreOpen = more.open; }); more.append(el("summary", null, t().more)); const f = el("div", "form");
  f.append(el("label", null, t().kind), sel(t().kinds, tr.kind, (v) => edit(() => { const n = defaultTrack(v); n.editor_name = tr.editor_name; n.editor_color = tr.editor_color; n.x = tr.x; n.y = tr.y; m.tracks[actorIndex] = n; })));

// ---- art ----------------------------------------------------------------------------------
async function imagePixels(file, size) {

  const w = size ? size[0] : bitmap.width, h = size ? size[1] : bitmap.height;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.imageSmoothingEnabled = false; ctx.drawImage(bitmap, 0, 0, w, h);
  return { rgba: ctx.getImageData(0, 0, w, h).data, w, h };
}

// ---- play ---------------------------------------------------------------------------------
function startPlay() {
  let rom;
  try { rom = P.playRom(romInfo, project, movieIndex); } catch (e) { toast(t().playBlocked(e.message), "bad"); return; }
  if (!window.jsnes) { toast(t().playBlocked("jsnes did not load"), "bad"); return; }
  if (looping) { clearInterval(looping); looping = null; }
  const ctx = $("screen").getContext("2d"); const img = ctx.createImageData(256, 240); const view = new Uint32Array(img.data.buffer);
  if (!audio) { try { audio = new AudioContext({ sampleRate: 48000 }); } catch { audio = null; } }
  let ring = new Float32Array(48000), head = 0, tail = 0; let node = null;
  if (audio) { audio.resume(); node = audio.createScriptProcessor(2048, 0, 2); node.onaudioprocess = (ev) => { const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1); for (let i = 0; i < L.length; i++) { const v = tail !== head ? ring[tail] : 0; if (tail !== head) tail = (tail + 1) % ring.length; L[i] = R[i] = muted ? 0 : v; } }; node.connect(audio.destination); }
  try {

  } catch (e) {

    toast(t().playBlocked(e.message), "bad");
    return;
  }
  player.node = node;
  let last = performance.now(), acc = 0;
  const loop = (now) => { if (!player) return; acc += now - last; last = now; let n = 0; while (acc >= 1000 / 60 && n < 4) { player.step(); acc -= 1000 / 60; n++; } if (n === 4) acc = 0; raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  render();
}
function stopPlay() { if (!player) return; cancelAnimationFrame(raf); player.stop(); if (player.node) { player.node.onaudioprocess = null; player.node.disconnect(); } player = null; render(); }
